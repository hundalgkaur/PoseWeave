<style>
        body {
            background-color: #0d1516;
        }
        .glass-panel {
            background: rgba(21, 29, 30, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid #1E1E1E;
            background-image: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
        }
        .glass-input {
            background: rgba(13, 21, 22, 0.6);
            border: 1px solid #1E1E1E;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            border-color: #00daf3;
            box-shadow: inset 0 0 10px rgba(0, 218, 243, 0.1), 0 0 10px rgba(0, 218, 243, 0.2);
            outline: none;
        }
        .btn-primary {
            background-color: #00daf3;
            color: #001f24;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.6);
            transform: translateY(-1px);
        }
        .btn-social {
            background: rgba(21, 29, 30, 0.6);
            border: 1px solid #1E1E1E;
            transition: all 0.2s ease;

            border-color: #3b494c;
        }

<style>
    body {
      min-height: max(884px, 100dvh);

<body class="text-on-background min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop overflow-hidden relative">
<!-- Atmospheric Glow -->
<div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-primary/10 rounded-full blur-[100px] pointer-events-none"></div>
<main class="w-full max-w-md z-10 flex flex-col items-center">
<!-- Logo Header -->
<div class="mb-10 flex flex-col items-center">
<div class="w-16 h-16 mb-4 relative flex items-center justify-center">
<span class="material-symbols-outlined text-[48px] text-primary-fixed-dim absolute" style="font-variation-settings: 'FILL' 1;">
                    biotech
                </span>
<!-- Subtle grid behind logo -->
<div class="absolute inset-0 border border-primary/20 rounded-lg -rotate-45 opacity-50"></div>
<div class="absolute inset-0 border border-primary/20 rounded-lg rotate-45 opacity-50"></div>
</div>
<h1 class="font-display-lg text-[36px] text-on-surface tracking-tight text-center">Diagnostic Portal</h1>
<p class="font-metric-sm text-metric-sm text-primary mt-2 opacity-80 uppercase tracking-widest text-center">Secure Clinical Access</p>
</div>
<!-- Login Form Panel -->
<div class="glass-panel w-full rounded-xl p-8 relative">
<!-- HUD Corners -->
<div class="absolute top-0 left-0 w-4 h-4 border-t border-l border-primary/50 rounded-tl-xl pointer-events-none"></div>
<div class="absolute top-0 right-0 w-4 h-4 border-t border-r border-primary/50 rounded-tr-xl pointer-events-none"></div>
<div class="absolute bottom-0 left-0 w-4 h-4 border-b border-l border-primary/50 rounded-bl-xl pointer-events-none"></div>
<div class="absolute bottom-0 right-0 w-4 h-4 border-b border-r border-primary/50 rounded-br-xl pointer-events-none"></div>
<form action="#" class="flex flex-col gap-6" method="POST">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-2" for="email">
<span class="material-symbols-outlined text-[16px]">badge</span>
                        Clinician ID
                    </label>
<input class="glass-input w-full rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50" id="email" name="email" placeholder="user@clinic.org" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-2" for="password">
<span class="material-symbols-outlined text-[16px]">vpn_key</span>
                            Secure Access Token
                        </label>
<a class="font-label-caps text-label-caps text-primary hover:text-primary-fixed transition-colors" href="#">Forgot?</a>
</div>
<input class="glass-input w-full rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>
</div>
<!-- Primary Action -->
<button class="btn-primary w-full rounded-lg py-3 mt-2 font-headline-md-mobile text-headline-md-mobile flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined">verified_user</span>
                    Authorize Session
                </button>
</form>
<div class="my-6 flex items-center gap-4">
<div class="h-px bg-outline-variant/50 flex-1"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant">OR AUTHENTICATE VIA</span>
<div class="h-px bg-outline-variant/50 flex-1"></div>
</div>
<!-- Social Logins -->
<div class="flex flex-col gap-3">
<button class="btn-social w-full rounded-lg py-3 px-4 flex items-center justify-center gap-3 font-body-md text-body-md text-on-surface">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_balance</span>
                    Institution SSO
                </button>
<button class="btn-social w-full rounded-lg py-3 px-4 flex items-center justify-center gap-3 font-body-md text-body-md text-on-surface">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">smart_card</span>
                    SmartCard Login
                </button>
</div>
</div>
<!-- Footer Links -->
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Need access? 
                <a class="text-primary hover:text-primary-fixed font-medium transition-colors ml-1" href="#">Request Credentials</a>
</p>
</div>
</main>
</body></html>
