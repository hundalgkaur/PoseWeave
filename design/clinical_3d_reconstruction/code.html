<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>3D Orthopedic Reconstruction</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                extend: {

                        "surface-variant": "#43474e",
                        "on-primary": "#003642",

                        "on-secondary-fixed": "#0f1e24",

                        "tertiary-fixed-dim": "#4cd9de",
                        "primary": "#87d1ea",
                        "on-surface-variant": "#c3c7cf",
                        "secondary-fixed": "#d3e5ed",
                        "inverse-on-surface": "#2e3133",
                        "surface-container-lowest": "#0c0e11",
                        "surface": "#111316",
                        "error": "#ffb4ab",
                        "surface-container-high": "#282a2d",
                        "on-tertiary-container": "#cce8ea",
                        "surface-tint": "#87d1ea",
                        "tertiary-fixed": "#6cf6fa",

                    "fontFamily": {
                        "metric-sm": ["JetBrains Mono"],

                    "fontSize": {

                }
            }
        }

<style>
        .neo-glass {
            background: rgba(17, 19, 22, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(141, 145, 153, 0.2);
        }
        .neon-text-primary {
            text-shadow: 0 0 4px rgba(135, 209, 234, 0.4);
        }
        .perspective-grid {
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(141, 145, 153, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(141, 145, 153, 0.1) 1px, transparent 1px);
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .glow-bloom {
            box-shadow: 0 0 10px rgba(135, 209, 234, 0.2);
        }
        .medical-xray {
            filter: grayscale(100%) contrast(120%) brightness(110%) sepia(20%) hue-rotate(180deg) opacity(0.9);
            mix-blend-mode: screen;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface h-screen w-full overflow-hidden flex flex-col font-body-md selection:bg-primary selection:text-on-primary relative">
<!-- Background Grid -->
<div class="perspective-grid"></div>
<!-- TopAppBar -->
<header class="flex justify-between items-center px-margin-desktop py-4 w-full bg-surface-container/80 backdrop-blur-md full-width top-0 z-50 border-b border-outline-variant/30">
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-2 rounded-full hover:bg-surface-variant/20">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<div class="flex flex-col items-center">
<h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight">Orthopedic Recon</h1>
<span class="font-label-caps text-on-surface-variant text-[10px]">DICOM Viewer v4.2</span>
</div>
<div class="w-8 h-8 rounded-full bg-surface-variant overflow-hidden border border-outline-variant/30 flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-sm" data-icon="person">person</span>
</div>
</header>
<!-- Main Canvas Area -->
<main class="flex-grow relative z-10 flex items-center justify-center w-full h-full overflow-hidden">
<!-- Left Side: Joint Angles Data Panel -->
<div class="absolute left-margin-desktop top-1/4 neo-glass rounded-lg p-4 flex flex-col gap-4 min-w-[200px] shadow-2xl hidden md:flex border border-outline-variant/50">
<div class="flex items-center gap-2 mb-1 border-b border-outline-variant/30 pb-2">
<span class="material-symbols-outlined text-primary text-sm" data-icon="analytics">analytics</span>
<span class="font-label-caps text-label-caps text-on-surface-variant tracking-widest uppercase">Kinematics</span>
</div>
<div class="flex justify-between items-center group border-b border-outline-variant/10 pb-2">
<span class="font-metric-sm text-metric-sm text-on-surface">Knee Flexion</span>
<div class="flex items-center gap-2">
<span class="font-metric-sm text-metric-sm text-primary neon-text-primary">142.4°</span>
<div class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></div>
</div>
</div>
<div class="flex justify-between items-center group border-b border-outline-variant/10 pb-2">
<span class="font-metric-sm text-metric-sm text-on-surface">Hip Rotation</span>
<div class="flex items-center gap-2">
<span class="font-metric-sm text-metric-sm text-primary neon-text-primary">-15.2°</span>
<div class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse" style="animation-delay: 0.5s;"></div>
</div>
</div>
<div class="flex justify-between items-center group">
<span class="font-metric-sm text-metric-sm text-on-surface">Ankle Dorsiflexion</span>
<div class="flex items-center gap-2">
<span class="font-metric-sm text-metric-sm text-primary neon-text-primary">8.7°</span>
<div class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse" style="animation-delay: 0.2s;"></div>
</div>
</div>
</div>
<!-- Center 3D Subject Placeholder -->
<div class="relative w-full max-w-[600px] aspect-square flex items-center justify-center">
<!-- Simulated 3D wireframe image -->
<div class="w-3/4 h-3/4 relative z-20">
<img alt="3D Medical Skeleton" class="w-full h-full object-contain medical-xray" data-alt="A highly detailed volumetric scan of a human skeleton, appearing like a medical grade x-ray or CT reconstruction. The bones have a realistic, semi-translucent quality, set against a dark neutral background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDNmUiFbcsTReacLdTjaGDglnlazOdBIvTldtsnRXAbGLTUDWMhgAiCwM89olxwuy10sf4f9gF6LEZaA_qo3bUtUzNWawJvOzGce1IkX4bQ0TH9LNgDeD_IrDULsTrgY_BZnzfOfvhQRT6xA-zfrqcGImkGt_psxKOzCmak-bjmpmilYa5YUn_RPl0Z_IQeQANfeQ8tubvL9ybMgj7UvVMaeyMM-uvCHaF8Q_Jt1A3V5Tl-I4aWDoxAPwN_3X-rcgjUbSAI0_e6t4A" style="transform: scale(1.1); filter: drop-shadow(0 0 10px rgba(135, 209, 234, 0.1));"/>
</div>
<!-- Scanner HUD Overlays -->
<div class="absolute top-10 left-10 w-8 h-8 border-t-2 border-l-2 border-outline-variant/60"></div>
<div class="absolute top-10 right-10 w-8 h-8 border-t-2 border-r-2 border-outline-variant/60"></div>
<div class="absolute bottom-10 left-10 w-8 h-8 border-b-2 border-l-2 border-outline-variant/60"></div>
<div class="absolute bottom-10 right-10 w-8 h-8 border-b-2 border-r-2 border-outline-variant/60"></div>
<!-- Crosshairs -->
<div class="absolute top-1/2 left-0 right-0 h-[1px] bg-outline-variant/20 pointer-events-none"></div>
<div class="absolute left-1/2 top-0 bottom-0 w-[1px] bg-outline-variant/20 pointer-events-none"></div>
</div>
<!-- Bottom Control Dock -->
<div class="absolute bottom-16 left-1/2 -translate-x-1/2 z-40 w-full max-w-md px-4">
<div class="neo-glass p-2 rounded-xl flex gap-2 shadow-2xl justify-between border border-outline-variant/40">
<button class="flex-1 py-3 rounded-lg font-label-caps text-label-caps text-on-surface hover:bg-surface-variant/30 transition-colors flex items-center justify-center gap-2 group">
<span class="material-symbols-outlined text-sm text-outline group-hover:text-primary transition-colors" data-icon="restart_alt">restart_alt</span>
                    Reset View
                </button>
<button class="flex-1 py-3 rounded-lg bg-primary/10 font-label-caps text-label-caps text-primary border border-primary/20 flex items-center justify-center gap-2 hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-sm text-primary" data-icon="360">360</span>
<span>Anatomic Rotation</span>
</button>
<button class="flex-1 py-3 rounded-lg font-label-caps text-label-caps text-on-surface hover:bg-surface-variant/30 transition-colors flex items-center justify-center gap-2 group">
<span class="material-symbols-outlined text-sm text-outline group-hover:text-primary transition-colors" data-icon="download">download</span>
                    Export DICOM
                </button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="flex justify-around items-center w-full h-20 px-4 bg-surface-container/90 backdrop-blur-xl fixed bottom-0 z-50 border-t border-outline-variant/30 md:hidden">
<button class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:bg-surface-variant/30 p-2 rounded-xl transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="monitor_heart">monitor_heart</span>
<span class="font-label-caps text-label-caps">Live</span>
</button>
<button class="flex flex-col items-center justify-center text-primary-fixed-dim bg-primary/10 rounded-xl px-4 py-1.5 transform scale-90 duration-200 border border-primary/20">
<span class="material-symbols-outlined mb-1" data-icon="view_in_ar" data-weight="fill" style="font-variation-settings: 'FILL' 1;">view_in_ar</span>
<span class="font-label-caps text-label-caps">Recon</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:bg-surface-variant/30 p-2 rounded-xl transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="folder_open">folder_open</span>
<span class="font-label-caps text-label-caps">Studies</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:bg-surface-variant/30 p-2 rounded-xl transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="analytics">analytics</span>
<span class="font-label-caps text-label-caps">Data</span>
</button>
</nav>
<!-- Side Navigation Shell for Desktop -->
<aside class="fixed top-20 right-0 h-full w-20 flex-col gap-6 py-6 items-center hidden md:flex border-l border-outline-variant/30 z-40 bg-surface-container/80 backdrop-blur-md">
<button class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:text-primary transition-colors group p-2">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform" data-icon="monitor_heart">monitor_heart</span>
<span class="font-label-caps text-[10px] mt-1 opacity-0 group-hover:opacity-100 transition-opacity">Live</span>
</button>
<button class="flex flex-col items-center justify-center text-primary relative p-2">
<div class="absolute inset-0 bg-primary/10 rounded-lg blur-sm border border-primary/20"></div>
<span class="material-symbols-outlined relative z-10" data-icon="view_in_ar" data-weight="fill" style="font-variation-settings: 'FILL' 1;">view_in_ar</span>
<span class="font-label-caps text-[10px] mt-1 relative z-10">Recon</span>
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-6 bg-primary rounded-r-full shadow-[0_0_8px_rgba(135,209,234,0.6)]"></div>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:text-primary transition-colors group p-2">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform" data-icon="folder_open">folder_open</span>
<span class="font-label-caps text-[10px] mt-1 opacity-0 group-hover:opacity-100 transition-opacity">Studies</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:text-primary transition-colors group p-2">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform" data-icon="analytics">analytics</span>
<span class="font-label-caps text-[10px] mt-1 opacity-0 group-hover:opacity-100 transition-opacity">Data</span>
</button>
</aside>
</body></html>
